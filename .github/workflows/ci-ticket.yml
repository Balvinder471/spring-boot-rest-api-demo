name: PolicyServer Ticket CI

on:
  push:
    branches:
      - "ticket/**"

jobs:
  build-binary:
    name: Build PolicyServer Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build binary
        shell: cmd
        env:
          BINARY_PATH: ${{ github.workspace }}\binary-output
        run: call build-binary.bat

      - name: Upload binary artifact (overwrite behavior)
        uses: actions/upload-artifact@v4
        with:
          name: policyserver-${{ github.ref_name }}-binary
          path: binary-output\*.jar
          retention-days: 2